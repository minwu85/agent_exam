spring.application.name=backend

# pgvector (Stage 9): schema auto-init defaults to false (same caution as spring.jpa
# ddl-auto would if it defaulted to none) - without this the store logs "Initializing"
# but never actually runs CREATE TABLE, so /index fails with "relation vector_store does
# not exist" the first time. Fine to leave true for this single-developer project; a real
# deployment would run this as an explicit migration instead.
spring.ai.vectorstore.pgvector.initialize-schema=true

# Postgres (auto-started via compose.yaml + spring-boot-docker-compose when Docker is available)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Anthropic (Claude) via Spring AI
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5

# Lecture file uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads
